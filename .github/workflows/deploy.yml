name: Build and Deploy to EC2 via GitHub Action

on:
 push:
    branches: 
        - main

jobs:
    build:
        runs-on: ubuntu:latest

        steps:
            - name: Checkout Repo #ALWAYS this first step
              uses: actions/checkout@v4

            - name: Log in to Docker Hub
              run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_Password }} # easy code to login
              # uses: docker/login-action@v4
              # with:
                #username: ${{ secrets.DOCKER_USERNAME }}
                #password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and Push Docker Image
              run: docker build -t saif007alam/webpage . # it builds the docker image of webpage to docker hub
            
            - name: Publish and Push image to docker hub
              run: docker push saif007alam/webpage:latest
            #uses: docker/build-push-action@v4
              #with:
                #context: .
                #push: true
                #tags: ${{ secrets.DOCKER_USERNAME }} my-webpage:latest
    deploy:
        runs-on: build

        steps:  
            - name: Deploy to EC2 Instance via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: ${{ secrets. EC2_IP }}
                username: ${{ secrets.EC2_USER }}
                password: ${{ secrets.EC2_SSH_KEY}}
            
            - name: Pull Image from Docker
              run: docker pull saif007alam/webpage:latest

            - name: Remove any old container
              run: docker rm -f webpage
            
            - name: Run Docker Container
              run: docker run -d -p 80:80 -name webpage-container saif007alam/webpage:latest
            

