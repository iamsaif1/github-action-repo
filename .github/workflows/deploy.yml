name: #Build and Deploy to EC2 via GitHub Action
      Build Docker Image file and Copy TXT file to Docker Server via Github Action
on:
 push:
    branches: 
        - testbranch

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repo #ALWAYS this first step
              uses: actions/checkout@v4

            - name: Log in to Docker Hub
              run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_Password }} # easy code to login
              # uses: docker/login-action@v4
              # with:
                #username: ${{ secrets.DOCKER_USERNAME }}
                #password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and Push Docker Image
              #run: docker build -t saif007alam/webpage .  # it builds the docker image of webpage to docker hub
              run: docker build -t saif007alam/test-file .

            - name: Publish and Push image to docker hub
              #run: docker push saif007alam/webpage:latest
              run: docker push saif007alam/test-file:latest
